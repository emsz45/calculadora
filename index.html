<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Interactiva</title>
    <link rel="icon" href="foto.png" type="image/png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
    background: linear-gradient(to right, #6578f6, #7bc1fe);
    color: white;
    display: flex;
    justify-content: center;
    padding: 20px;
    text-align: center;
    min-height: 100vh;
    overflow-y: auto;
        }

        .container {
            display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 600px;
    width: 100%;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem); /* Ajuste fluido */
    margin-bottom: 20px;
    color: #ffffff;
    font-family: 'Arial', sans-serif;
    text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.3);
    padding: 0 10px;
        }

        .image-container {
            position: relative;
            cursor: pointer;
            margin-top: 10px;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 10px; /* Bordes redondeados */
        }

        /* MODAL ESTILOS */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .modal-content {
            background-color: white;
    padding: 20px;
    border-radius: 10px;
    width: 95%;
    max-width: 500px;
    height: 85vh;
    display: flex;
    flex-direction: column;
        }

        .close {
            align-self: flex-end;
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
    h1 {
        font-size: clamp(1.4rem, 4.5vw, 2rem);
    }
    .modal-content {
        height: 90vh;
    }
}

@media (max-width: 480px) {
    h1 {
        font-size: clamp(1.2rem, 5vw, 1.8rem);
    }
    .modal-content {
        height: 85vh;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Pincha sobre la Calculadora</h1>
        <div class="image-container">
            <img src="papeleria.jpg" alt="Calculadora" usemap="#calculadora-map">
            <map name="calculadora-map">
                <area shape="rect" coords="24,42,200,270" alt="Abrir Calculadora" href="#" onclick="openModal(); return false;">
            </map>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal();">&times;</span>
            <iframe src="calculadora.html"></iframe>
        </div>
    </div>

    <script>
     function openModal() {
        document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("modal").style.display = "none";
    }

    window.onclick = function(event) {
        const modal = document.getElementById("modal");
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        const area = document.querySelector("area");
        const image = document.querySelector(".image-container img");

        image.addEventListener("mousemove", function(event) {
            const rect = image.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            // Ajustar las coordenadas según el tamaño de la imagen
            const areaCoords = [24,42,200,270];
            const scaleX = rect.width / image.naturalWidth;
            const scaleY = rect.height / image.naturalHeight;

            const adjustedCoords = [
                areaCoords[0] * scaleX,
                areaCoords[1] * scaleY,
                areaCoords[2] * scaleX,
                areaCoords[3] * scaleY
            ];

            if (x >= adjustedCoords[0] && x <= adjustedCoords[2] && y >= adjustedCoords[1] && y <= adjustedCoords[3]) {
                image.style.cursor = "pointer";
            } else {
                image.style.cursor = "default";
            }
        });
    });


    </script>
</body>
</html>
